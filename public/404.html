<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MINATRACK</title>
    <script>
      // GitHub Pages SPA redirect: send any 404 back to the app root
      var segment = window.location.pathname.split('/')[1];
      var base = segment ? '/' + segment + '/' : '/';
      window.location.replace(window.location.origin + base);
    </script>
  </head>
  <body></body>
</html>
